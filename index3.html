
<html>
<head>
<title>Calculator</title>

<style>
body { background: lightblue; text-align: center; }
form { background: white; padding: 20px; width: 250px; margin: auto; }
input, button { padding: 8px; margin: 5px; }
</style>

</head>

<body>

<h2>Simple Calculator</h2>

<form>

Enter First Number:<input type="number" id="n1"><br>

Enter Second Number:<input type="number" id="n2"><br><br>

<button type="button" onclick="add()">+</button>
<button type="button" onclick="sub()">-</button>
<button type="button" onclick="mul()">*</button>
<button type="button" onclick="div()">/</button>

<h3 id="result">Result:</h3>

</form>

<script>

let a, b;

function getValues()
{
    a = Number(document.getElementById("n1").value);
    b = Number(document.getElementById("n2").value);
}

function add()
{
    getValues();
    document.getElementById("result").innerHTML = "Result: " + (a+b);
}

function sub()
{
    getValues();
    document.getElementById("result").innerHTML = "Result: " + (a-b);
}

function mul()
{
    getValues();
    document.getElementById("result").innerHTML = "Result: " + (a*b);
}

function div()
{
    getValues();

    if(b == 0)
        alert("Cannot divide by zero");
    else
        document.getElementById("result").innerHTML = "Result: " + (a/b);
}

</script>

</body>
</html>
